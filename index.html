<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Video Player</title>
<style>
:root{--bg:#f4f4f2;--fg:#1b1b1a;--mut:#6b6b66;--card:#ffffff;--line:#d6d6d0;--acc:#2f6fed;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f0f0ee;--mut:#9a9a94;--card:#1f1f1e;--line:#3a3a38;--acc:#6b9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f0f0ee;--mut:#9a9a94;--card:#1f1f1e;--line:#3a3a38;--acc:#6b9bff;color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px}
h1{font-size:18px;margin:0;flex:1}
.btn{display:inline-block;padding:9px 14px;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
video{width:100%;max-height:36vh;background:#000;display:block}
#bar{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:14px;color:var(--mut)}
#now{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#prog{height:16px;margin:8px 12px 0;background:var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:pointer}
#pf{height:100%;width:0;background:var(--acc)}
#tm{font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
#ctl{display:flex;gap:8px;padding:0 12px 8px}
#pp{flex:1;height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;font-family:inherit}
#cap,#zm,#zp{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:0 14px;font-size:14px;font-family:inherit}
#zm,#zp{padding:0 14px;font-size:22px;line-height:1}
#prj,#pedit{display:flex;gap:6px;padding:0 12px 8px;align-items:center}
#prj select,#pedit input{flex:1;min-width:0;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
#prj button,#pedit button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit}
#imp{padding:0 12px 8px;font-size:13px;color:var(--mut)}
#impb{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
#impf{height:100%;width:0;background:var(--acc)}
#foot{position:relative;z-index:10;padding:10px 12px}
#go{width:100%;height:68px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:24px;font-weight:700}
#go:disabled{opacity:.35}
#stage{position:relative;background:#000}
#ph{width:100%;height:36vh;object-fit:contain;background:#000;display:block}
#wait{display:none;position:absolute;inset:0;background:#000}
#wait.on{display:block}
#nx{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#444;font-size:15px;padding:0 20px}
button.btn{border:0;font-family:inherit}
.mv{position:absolute;bottom:34px;width:min(34px,40%);height:30px;border-radius:15px;border:0;background:var(--acc);color:#fff;font-size:18px}
.mv.l{left:6px}
.mv.r{right:6px}
.num{position:absolute;left:6px;top:2px;z-index:2;pointer-events:none;font-weight:800;line-height:1.1;font-size:clamp(16px,calc(var(--tw,130px)*.3),44px);color:#fff;text-shadow:0 0 5px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.95)}
.btn:disabled{opacity:.4}
#mu{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 8px;font-size:18px;line-height:1.2}
#mu.on{background:var(--acc);border-color:var(--acc)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));touch-action:pan-y;gap:10px;padding:12px;align-content:start}
.tile{position:relative;background:var(--card);border:3px solid var(--mut);box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:12px;overflow:hidden;cursor:pointer;-webkit-touch-callout:none}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.drag{z-index:20;pointer-events:none;opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.tile.tgt{outline:3px dashed var(--acc);outline-offset:2px}
.th{aspect-ratio:16/9;background:#2a2a2a center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.nm{padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.hint{grid-column:1/-1;color:var(--mut);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header>
<h1>I miei video</h1>
<button class="btn" id="ord" type="button">Ordina</button>
<button class="btn" id="und" type="button" disabled>↶ Annulla</button>
<button class="btn" id="ap" type="button" hidden>AirPlay</button>
<label class="btn"><input type="file" id="file" accept="video/*" multiple hidden>+ Video</label>
<label class="btn"><input type="file" id="filep" accept="image/*" multiple hidden>+ Foto</label>
</header>
<div id="prj"><select id="psel" aria-label="Progetto"></select><button id="pnew" type="button">Nuovo</button><button id="pren" type="button">Rinomina</button><button id="pdel" type="button">Elimina</button></div>
<div id="pedit" hidden><input id="pname" maxlength="40" placeholder="Nome del progetto"><button id="pok" type="button">OK</button><button id="pno" type="button">Annulla</button></div>
<div id="imp" hidden><div id="impt"></div><div id="impb"><div id="impf"></div></div></div>
<div id="stage"><video id="v" playsinline></video><img id="ph" alt="" hidden><div id="wait"><div id="nx"></div></div></div>
<div id="prog" aria-label="Avanzamento"><div id="pf"></div></div>
<div id="bar"><span id="now">Nessun video in riproduzione</span><span id="tm">0:00 / 0:00</span><button id="mu" type="button" aria-label="Audio">🔊</button></div>
<div id="ctl"><button id="pp" type="button">Pausa</button><button id="cap" type="button">Anteprima</button><button id="zm" type="button" aria-label="Riduci le anteprime">−</button><button id="zp" type="button" aria-label="Ingrandisci le anteprime">+</button></div>
<div id="list"></div>
<div id="foot"><button id="go" type="button">Continua</button></div>

<script>
(function(){
var list=document.getElementById("list"),v=document.getElementById("v"),now=document.getElementById("now"),inp=document.getElementById("file"),prog=document.getElementById("prog"),pf=document.getElementById("pf"),tm=document.getElementById("tm"),go=document.getElementById("go"),wait=document.getElementById("wait"),ord=document.getElementById("ord"),cap=document.getElementById("cap"),pp=document.getElementById("pp"),ph=document.getElementById("ph"),ap=document.getElementById("ap"),nx=document.getElementById("nx");
var items=[],cur=-1,db=null,queue=[],busy=false,sorting=false,imp={t:0,d:0},projs=[],pid="p1";
try{projs=JSON.parse(localStorage.getItem("vpprojects")||"[]");pid=localStorage.getItem("vpcur")||"p1";}catch(e){}
if(!projs.length)projs=[{id:"p1",name:"Progetto 1"}];
if(!projs.some(function(p){return p.id===pid;}))pid=projs[0].id;

function openDB(cb){
  try{
    var r=indexedDB.open("videoplayer",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("v",{keyPath:"id"});};
    r.onsuccess=function(){db=r.result;cb();};
    r.onerror=function(){cb();};
  }catch(e){cb();}
}
function put(it,cb){
  if(!db){if(cb)cb();return;}
  try{
    var tx=db.transaction("v","readwrite");
    tx.objectStore("v").put({id:it.id,name:it.name,blob:it.blob,thumb:it.thumb,order:it.order,tv:it.tv||0,pid:it.pid||"p1",kind:it.kind||"video"});
    if(cb){tx.oncomplete=cb;tx.onerror=cb;tx.onabort=cb;}
  }catch(e){if(cb)cb();}
}
function del(id){
  if(!db)return;
  try{db.transaction("v","readwrite").objectStore("v").delete(id);}catch(e){}
}
function loadAll(){
  if(!db){render();return;}
  try{
    var q=db.transaction("v").objectStore("v").getAll();
    q.onsuccess=function(){
      var sv=[];try{sv=JSON.parse(localStorage.getItem("vporder-"+pid)||localStorage.getItem("vporder")||"[]");}catch(e){}
      function rk(r){var k=sv.indexOf(r.id);return k<0?1e9+r.order:k;}
      q.result.filter(function(r){return (r.pid||"p1")===pid;}).sort(function(a,b){return rk(a)-rk(b);}).forEach(function(r){
        var it={id:r.id,name:r.name,blob:r.blob,thumb:r.thumb||"",order:r.order,tv:r.tv||0,pid:pid,kind:r.kind||"video",url:URL.createObjectURL(r.blob)};
        items.push(it);if(it.tv<3)queue.push(it);
      });
      loadNums();render();pump();
    };
    q.onerror=render;
  }catch(e){render();}
}

function makeThumb(it,cb){
  var t=document.createElement("video"),done=false,times=[],k=0,best="",bs=-1;
  function fin(){if(done)return;done=true;try{t.pause();t.removeAttribute("src");t.load();if(t.parentNode)t.parentNode.removeChild(t);}catch(e){}cb(bs>=12?best:"");}
  function score(){
    try{
      var c=document.createElement("canvas");c.width=48;c.height=27;
      var x=c.getContext("2d");x.drawImage(t,0,0,48,27);
      var d=x.getImageData(0,0,48,27).data,s=0,s2=0,n=d.length/4;
      for(var i=0;i<d.length;i+=4){var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];s+=l;s2+=l*l;}
      var m=s/n;return m+Math.sqrt(Math.max(0,s2/n-m*m));
    }catch(e){return 0;}
  }
  function grab(){
    var w=240,h=Math.round(w*t.videoHeight/t.videoWidth)||135,c=document.createElement("canvas");
    c.width=w;c.height=h;c.getContext("2d").drawImage(t,0,0,w,h);
    return c.toDataURL("image/jpeg",0.6);
  }
  function next(){
    if(k>=times.length){fin();return;}
    try{t.currentTime=times[k++];}catch(e){fin();}
  }
  t.muted=true;t.defaultMuted=true;t.setAttribute("muted","");t.setAttribute("playsinline","");t.playsInline=true;t.preload="auto";
  t.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none";
  document.body.appendChild(t);
  var started=false;
  function start(){
    if(started||done)return;started=true;
    var d=t.duration;
    times=(isFinite(d)&&d>0)?[0.05,0.15,0.3,0.5,0.7,0.85].map(function(f){return d*f;}):[0.5];
    next();
  }
  t.onloadedmetadata=function(){
    var p;try{p=t.play();}catch(e){}
    if(p&&p.then)p.then(function(){t.pause();start();},function(){start();});else start();
  };
  t.onseeked=function(){
    var ok=false;
    function check(){
      if(ok)return;ok=true;
      try{var sc=score();if(sc>bs){bs=sc;best=grab();}}catch(e){}
      if(bs>90){fin();return;}
      next();
    }
    if(t.requestVideoFrameCallback){t.requestVideoFrameCallback(check);setTimeout(check,700);}
    else setTimeout(check,350);
  };
  t.onerror=function(){fin();};
  setTimeout(fin,20000);
  t.src=it.url;
}
function photoThumb(it,cb){
  var im=new Image(),done=false;
  function fin(d){if(done)return;done=true;cb(d||"");}
  im.onload=function(){
    try{
      var w=240,h=Math.round(w*im.naturalHeight/im.naturalWidth)||135,c=document.createElement("canvas");
      c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
      fin(c.toDataURL("image/jpeg",0.7));
    }catch(e){fin();}
  };
  im.onerror=function(){fin();};
  setTimeout(fin,10000);
  im.src=it.url;
}
function pump(){
  if(busy||!queue.length)return;
  busy=true;
  var it=queue.shift();
  (it.kind==="photo"?photoThumb:makeThumb)(it,function(d){it.thumb=d;it.tv=3;if(!it.gone)put(it);if(it.cnt){it.cnt=false;step();}busy=false;render();pump();});
}

function render(){
  if(drag){return;}
  updateGo();
  list.innerHTML="";
  if(!items.length){
    var h=document.createElement("div");h.className="hint";
    h.textContent="Nessun elemento. Usa “+ Video” o “+ Foto” per aggiungerne.";
    list.appendChild(h);return;
  }
  items.forEach(function(it,i){
    var t=document.createElement("div");t.className="tile"+(i===cur?" on":"");t.dataset.i=i;
    var th=document.createElement("div");th.className="th";
    if(it.thumb)th.style.backgroundImage="url("+it.thumb+")";
    if(!it.thumb){var hh=0;for(var q=0;q<it.name.length;q++)hh=(hh*31+it.name.charCodeAt(q))%360;th.style.backgroundColor="hsl("+hh+",35%,32%)";}
    th.textContent=it.kind==="photo"?(it.thumb?"":"🖼"):"▶";
    var nm=document.createElement("div");nm.className="nm";nm.textContent=it.name;
    var x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","Rimuovi");
    x.onclick=function(e){e.stopPropagation();remove(i);};
    t.onclick=function(){if(!sorting&&!justDragged)play(i);};
    t.appendChild(th);t.appendChild(nm);t.appendChild(x);
    var nb=document.createElement("div");nb.className="num";nb.textContent=nums[it.id]||"";t.appendChild(nb);
    if(sorting){
      var a=document.createElement("button");a.className="mv l";a.textContent="←";a.onclick=function(e){e.stopPropagation();move(i,-1);};
      var b=document.createElement("button");b.className="mv r";b.textContent="→";b.onclick=function(e){e.stopPropagation();move(i,1);};
      t.appendChild(a);t.appendChild(b);
    }
    list.appendChild(t);
  });
}

function play(i){
  if(i<0||i>=items.length)return;
  cur=i;
  setWait(false);
  if(items[i].kind==="photo"){
    v.pause();v.removeAttribute("src");v.load();v.hidden=true;
    ph.src=items[i].url;ph.hidden=false;
    pf.style.width="0%";tm.textContent="Foto";pp.textContent="Pausa";pp.disabled=true;
  }else{
    ph.hidden=true;ph.removeAttribute("src");v.hidden=false;pp.disabled=false;
    v.src=items[i].url;
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  }
  now.textContent="In riproduzione: "+items[i].name;
  render();
  var on=list.querySelector(".tile.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function fmt(s){if(!isFinite(s))s=0;var m=Math.floor(s/60),x=Math.floor(s%60);return m+":"+(x<10?"0":"")+x;}
function updateGo(){go.disabled=items.length===0||(cur>=0&&cur+1>=items.length);}
function setWait(on){
  wait.classList.toggle("on",on);
  document.body.classList.toggle("waiting",on);
  if(on)nx.textContent=cur+1<items.length?"Prossimo: "+items[cur+1].name:"Fine dell’elenco";
}
v.addEventListener("ended",function(){setWait(true);});
v.addEventListener("timeupdate",function(){
  pf.style.width=(v.duration?v.currentTime/v.duration*100:0)+"%";
  tm.textContent=fmt(v.currentTime)+" / "+fmt(v.duration);
});
v.addEventListener("click",function(){
  if(!v.getAttribute("src"))return;
  if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}else v.pause();
});
function seek(e){
  if(!isFinite(v.duration)||!v.duration)return;
  var r=prog.getBoundingClientRect();
  v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
}
prog.addEventListener("pointerdown",function(e){prog.setPointerCapture(e.pointerId);seek(e);});
prog.addEventListener("pointermove",function(e){if(prog.hasPointerCapture(e.pointerId))seek(e);});
go.addEventListener("click",function(){play(cur+1);});
function saveOrder(){try{localStorage.setItem("vporder-"+pid,JSON.stringify(items.map(function(x){return x.id;})));}catch(e){}}
function move(i,d){
  var j=i+d;if(j<0||j>=items.length)return;
  var t=items[i];pushUndo({order:items.map(function(x){return x.id;})});items[i]=items[j];items[j]=t;
  if(cur===i)cur=j;else if(cur===j)cur=i;
  saveOrder();render();
}
ord.addEventListener("click",function(){sorting=!sorting;ord.textContent=sorting?"Fine":"Ordina";render();});
v.addEventListener("webkitplaybacktargetavailabilitychanged",function(e){ap.hidden=e.availability!=="available";});
ap.addEventListener("click",function(){try{v.webkitShowPlaybackTargetPicker();}catch(e){}});
cap.addEventListener("click",function(){
  if(cur<0||!v.videoWidth)return;
  try{
    var w=240,h=Math.round(w*v.videoHeight/v.videoWidth),c=document.createElement("canvas");
    c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
    var it=items[cur];it.thumb=c.toDataURL("image/jpeg",0.6);it.tv=3;put(it);render();
    cap.textContent="Salvata";setTimeout(function(){cap.textContent="Anteprima";},1200);
  }catch(e){}
});

function remove(i){
  var it=items[i];
  pushUndo({del:it,index:i});it.gone=true;
  try{URL.revokeObjectURL(it.url);}catch(e){}
  del(it.id);
  if(i===cur){v.pause();v.removeAttribute("src");v.load();ph.hidden=true;v.hidden=false;pp.disabled=false;cur=-1;now.textContent="Nessun video in riproduzione";}
  else if(i<cur)cur--;
  items.splice(i,1);saveOrder();render();
}

function addFiles(inp,kind){
  var files=Array.prototype.slice.call(inp.files||[]),base=Date.now();
  imp.t+=files.length*2;showImp();
  files.forEach(function(f,k){
    var it={id:base+"-"+k,name:f.name.replace(/\.[^.]+$/,""),blob:f,url:URL.createObjectURL(f),thumb:"",order:base+k,pid:pid,kind:kind,cnt:true};
    nums[it.id]=nextNum();
    items.push(it);put(it,step);queue.push(it);
  });
  inp.value="";
  saveOrder();saveNums();
  render();pump();
}
inp.addEventListener("change",function(){addFiles(inp,"video");});
var inpp=document.getElementById("filep");
inpp.addEventListener("change",function(){addFiles(inpp,"photo");});

function showImp(){
  var e=document.getElementById("imp");
  if(imp.t<=imp.d){e.hidden=true;imp.t=0;imp.d=0;return;}
  e.hidden=false;
  document.getElementById("impf").style.width=(imp.d/imp.t*100)+"%";
  document.getElementById("impt").textContent="Importazione in corso: "+Math.floor(imp.d/2)+" / "+Math.round(imp.t/2)+" elementi";
}
function step(){imp.d++;showImp();}
pp.addEventListener("click",function(){
  if(!v.getAttribute("src"))return;
  if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}else v.pause();
});
v.addEventListener("play",function(){pp.textContent="Pausa";});
v.addEventListener("pause",function(){pp.textContent="Riprendi";});
v.addEventListener("ended",function(){pp.textContent="Pausa";});
var psel=document.getElementById("psel"),pedit=document.getElementById("pedit"),pname=document.getElementById("pname"),pdel=document.getElementById("pdel"),pmode="",armed=false;
function saveProj(){try{localStorage.setItem("vpprojects",JSON.stringify(projs));localStorage.setItem("vpcur",pid);}catch(e){}}
function fillProj(){psel.innerHTML="";projs.forEach(function(p){var o=document.createElement("option");o.value=p.id;o.textContent=p.name;psel.appendChild(o);});psel.value=pid;}
function openProject(id){
  items.forEach(function(it){try{URL.revokeObjectURL(it.url);}catch(e){}});
  items=[];queue=[];cur=-1;sorting=false;ord.textContent="Ordina";undo=[];updUndo();
  v.pause();v.removeAttribute("src");v.load();ph.hidden=true;v.hidden=false;pp.disabled=false;now.textContent="Nessun video in riproduzione";setWait(false);
  pid=id;saveProj();fillProj();render();loadAll();
}
function askName(mode,txt){pmode=mode;pname.value=txt;pedit.hidden=false;pname.focus();}
psel.addEventListener("change",function(){openProject(psel.value);});
document.getElementById("pnew").addEventListener("click",function(){askName("new","");});
document.getElementById("pren").addEventListener("click",function(){var p=projs.filter(function(x){return x.id===pid;})[0];askName("ren",p?p.name:"");});
document.getElementById("pno").addEventListener("click",function(){pedit.hidden=true;});
document.getElementById("pok").addEventListener("click",function(){
  var n=pname.value.replace(/^\s+|\s+$/g,"");if(!n)return;
  pedit.hidden=true;
  if(pmode==="new"){var id="p"+Date.now();projs.push({id:id,name:n});openProject(id);}
  else{projs.forEach(function(p){if(p.id===pid)p.name=n;});saveProj();fillProj();}
});
pdel.addEventListener("click",function(){
  if(projs.length<2){pdel.textContent="Serve un altro";setTimeout(function(){pdel.textContent="Elimina";},1500);return;}
  if(!armed){armed=true;pdel.textContent="Conferma?";setTimeout(function(){armed=false;pdel.textContent="Elimina";},3000);return;}
  armed=false;pdel.textContent="Elimina";
  items.forEach(function(it){del(it.id);});
  try{localStorage.removeItem("vporder-"+pid);localStorage.removeItem("vpnums-"+pid);}catch(e){}
  var gone=pid;projs=projs.filter(function(p){return p.id!==gone;});
  openProject(projs[0].id);
});
var tw=130,pd=0,p0=130;
try{tw=parseInt(localStorage.getItem("vptw"),10)||130;}catch(e){}
function setTw(x){tw=Math.max(60,Math.min(260,Math.round(x)));list.style.setProperty("--tw",tw+"px");}
function saveTw(){try{localStorage.setItem("vptw",String(tw));}catch(e){}}
function tdist(e){var a=e.touches[0],b=e.touches[1];return Math.sqrt(Math.pow(a.clientX-b.clientX,2)+Math.pow(a.clientY-b.clientY,2));}
setTw(tw);
list.addEventListener("touchstart",function(e){if(e.touches.length===2){pd=tdist(e);p0=tw;}},{passive:true});
list.addEventListener("touchmove",function(e){if(e.touches.length===2&&pd){e.preventDefault();setTw(p0*tdist(e)/pd);}},{passive:false});
list.addEventListener("touchend",function(e){if(e.touches.length<2&&pd){pd=0;saveTw();}});
list.addEventListener("gesturestart",function(e){e.preventDefault();});
document.getElementById("zm").addEventListener("click",function(){setTw(tw*0.8);saveTw();});
document.getElementById("zp").addEventListener("click",function(){setTw(tw*1.25);saveTw();});
var drag=null,lt=null,lx=0,ly=0,st0=0,justDragged=false;
function endDrag(apply){
  clearTimeout(lt);
  if(!drag)return;
  var d=drag;drag=null;
  d.el.classList.remove("drag");d.el.style.transform="";
  var all=list.querySelectorAll(".tgt");for(var n=0;n<all.length;n++)all[n].classList.remove("tgt");
  justDragged=true;setTimeout(function(){justDragged=false;},450);
  if(apply&&d.over>=0&&d.over!==d.i){
    var curItem=cur>=0?items[cur]:null;
    pushUndo({order:items.map(function(x){return x.id;})});
    var moved=items.splice(d.i,1)[0];items.splice(d.over,0,moved);
    cur=curItem?items.indexOf(curItem):-1;
    saveOrder();
  }
  render();
}
list.addEventListener("touchstart",function(e){
  clearTimeout(lt);
  if(e.touches.length!==1){if(drag)endDrag(false);return;}
  var tl=e.target.closest?e.target.closest(".tile"):null;
  if(!tl)return;
  var t=e.touches[0];lx=t.clientX;ly=t.clientY;
  lt=setTimeout(function(){
    drag={i:parseInt(tl.dataset.i,10),el:tl,over:-1};
    st0=list.scrollTop;
    tl.classList.add("drag");
  },380);
},{passive:true});
list.addEventListener("touchmove",function(e){
  var t=e.touches[0];
  if(!drag){if(Math.abs(t.clientX-lx)>10||Math.abs(t.clientY-ly)>10)clearTimeout(lt);return;}
  e.preventDefault();
  var r=list.getBoundingClientRect();
  if(t.clientY<r.top+50)list.scrollTop-=14;else if(t.clientY>r.bottom-50)list.scrollTop+=14;
  drag.el.style.transform="translate("+(t.clientX-lx)+"px,"+(t.clientY-ly+list.scrollTop-st0)+"px) scale(1.05)";
  var el=document.elementFromPoint(t.clientX,t.clientY),tl=el&&el.closest?el.closest(".tile"):null;
  var prev=list.querySelector(".tgt");if(prev&&prev!==tl)prev.classList.remove("tgt");
  if(tl&&tl!==drag.el){tl.classList.add("tgt");drag.over=parseInt(tl.dataset.i,10);}else if(!tl){drag.over=-1;}
},{passive:false});
list.addEventListener("touchend",function(){endDrag(true);clearTimeout(lt);});
list.addEventListener("touchcancel",function(){endDrag(false);});
var nums={};
function saveNums(){try{localStorage.setItem("vpnums-"+pid,JSON.stringify(nums));}catch(e){}}
function nextNum(){var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];return mx+1;}
function loadNums(){
  try{nums=JSON.parse(localStorage.getItem("vpnums-"+pid)||"{}");}catch(e){nums={};}
  var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];
  items.slice().sort(function(a,b){return a.order-b.order;}).forEach(function(it){if(!nums[it.id])nums[it.id]=++mx;});
  saveNums();
}
var mu=document.getElementById("mu");
function applyMute(){mu.textContent=v.muted?"🔇":"🔊";mu.classList.toggle("on",v.muted);}
try{v.muted=localStorage.getItem("vpmute")==="1";}catch(e){}
applyMute();
mu.addEventListener("click",function(){v.muted=!v.muted;try{localStorage.setItem("vpmute",v.muted?"1":"0");}catch(e){}applyMute();});
v.addEventListener("volumechange",applyMute);
var undo=[],und=document.getElementById("und");
function updUndo(){und.disabled=!undo.length;und.textContent="↶ Annulla"+(undo.length?" ("+undo.length+")":"");}
function pushUndo(e){undo.push(e);if(undo.length>50)undo.shift();updUndo();}
function doUndo(){
  var e=undo.pop();if(!e)return;
  var curItem=cur>=0?items[cur]:null;
  if(e.del){
    var it=e.del;it.gone=false;it.url=URL.createObjectURL(it.blob);
    items.splice(Math.min(e.index,items.length),0,it);
    put(it);
  }else if(e.order){
    var byId={};items.forEach(function(x){byId[x.id]=x;});
    var out=[];e.order.forEach(function(id){if(byId[id]){out.push(byId[id]);delete byId[id];}});
    items.forEach(function(x){if(byId[x.id])out.push(x);});
    items=out;
  }
  cur=curItem?items.indexOf(curItem):-1;
  saveOrder();updUndo();render();
}
und.addEventListener("click",doUndo);
updUndo();
fillProj();openDB(loadAll);
})();
</script>
