<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Video Player</title>
<style>
:root{--bg:#f4f4f2;--fg:#1b1b1a;--mut:#6b6b66;--card:#ffffff;--line:#d6d6d0;--acc:#2f6fed;--del:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--fg:#f0f0ee;--mut:#9a9a94;--card:#1f1f1e;--line:#3a3a38;--acc:#6b9bff;--del:#ef4444;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--fg:#f0f0ee;--mut:#9a9a94;--card:#1f1f1e;--line:#3a3a38;--acc:#6b9bff;--del:#ef4444;color-scheme:dark}
*,*::before,*::after{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important;-webkit-user-drag:none}
input,select,textarea{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;touch-action:none}
h1{font-size:18px;margin:0;flex:1}
.btn{display:inline-block;padding:9px 14px;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation}
video,#ph{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:auto}
#bar{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:14px;color:var(--mut);touch-action:none}
#now{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#prog{height:16px;margin:8px 12px 0;background:var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:pointer}
#pf{height:100%;width:0;background:var(--acc);pointer-events:none}
#tm{font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
#ctl{display:flex;gap:8px;padding:0 12px 8px;flex-wrap:wrap;touch-action:none;position:relative;z-index:30}
#pp{flex:1;min-width:90px;height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;font-family:inherit;touch-action:manipulation}
#cap,#pdur,#delcur{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit;height:44px;touch-action:manipulation}
#delcur{font-size:19px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;transition:transform .14s ease,background-color .14s ease,border-color .14s ease,box-shadow .14s ease}
#delcur:disabled{opacity:.35}
body.dragging #delcur{opacity:1!important;border-color:var(--del);background:color-mix(in srgb,var(--del) 14%,var(--card));transform:scale(1.06)}
body.dragging #delcur.hot{background:var(--del);border-color:var(--del);color:#fff;transform:scale(1.22);box-shadow:0 0 0 4px color-mix(in srgb,var(--del) 30%,transparent)}
#prj,#pedit{display:flex;gap:6px;padding:0 12px 8px;align-items:center;touch-action:none}
#prj select,#pedit input{flex:1;min-width:0;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px;touch-action:manipulation}
#prj button,#pedit button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;touch-action:manipulation}
#imp{padding:0 12px 8px;font-size:13px;color:var(--mut);touch-action:none}
#impb{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
#impf{height:100%;width:0;background:var(--acc)}
#foot{position:relative;z-index:10;padding:10px 12px;touch-action:none}
#go{width:100%;height:68px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:22px;font-weight:700;touch-action:manipulation}
#go:disabled{opacity:.35}
#stage{position:relative;background:#000;flex:none;overflow:hidden;width:70%;height:25.2vh;margin:0 auto;border-radius:10px;touch-action:none}

#wait{display:none;position:absolute;inset:0;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#wait.on{display:flex}
#nx{color:#e5e5e0;font-size:15px;padding:0 20px}
#nxbtn{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation}
button.btn{border:0;font-family:inherit}
.mv{position:absolute;bottom:34px;width:min(34px,40%);height:30px;border-radius:15px;border:0;background:var(--acc);color:#fff;font-size:18px;touch-action:manipulation}
.mv.l{left:6px}
.mv.r{right:6px}
.num{position:absolute;left:6px;top:2px;z-index:2;pointer-events:none;font-weight:800;line-height:1.1;font-size:clamp(16px,calc(var(--tw,130px)*.3),44px);color:#fff;text-shadow:0 0 5px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.95)}
.btn:disabled{opacity:.4}
#mu{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 8px;font-size:18px;line-height:1.2;touch-action:manipulation}
#mu.on{background:var(--acc);border-color:var(--acc)}

#listwrap{flex:1 1 0;min-height:0;display:flex;align-items:stretch;overflow:hidden;touch-action:none}
#list{flex:1 1 0;min-width:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));grid-auto-rows:max-content;touch-action:pan-y;gap:10px;padding:12px 6px 12px 12px;align-content:start;align-items:start}
#zrail{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px 12px 2px;touch-action:none;cursor:ns-resize}
#ztrack{position:relative;width:8px;height:100%;max-height:260px;min-height:90px;background:var(--line);border-radius:99px}
#zfill{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:99px;pointer-events:none}
#zthumb{position:absolute;left:50%;width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,50%);pointer-events:none}

.tile{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--mut);box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:12px;overflow:hidden;cursor:pointer;min-width:0}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.drag{z-index:40;pointer-events:none;opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:border-color .12s ease,opacity .12s ease}
.tile.drag.trash{border-color:var(--del);opacity:.78}
.tile.tgt{outline:3px dashed var(--acc);outline-offset:2px}
.th{position:relative;width:100%;aspect-ratio:16/9;flex:none;background:#2a2a2a center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;pointer-events:none}
@supports not (aspect-ratio:16/9){.th{height:0;padding-top:56.25%}.th>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}}
.nm{padding:6px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hint{grid-column:1/-1;color:var(--mut);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header>
<h1>I miei video</h1>
<button class="btn" id="ord" type="button">Ordina</button>
<button class="btn" id="und" type="button" disabled>↶ Annulla</button>
<button class="btn" id="ap" type="button" hidden>AirPlay</button>
<label class="btn"><input type="file" id="file" accept="video/*" multiple hidden>+ Video</label>
<label class="btn"><input type="file" id="filep" accept="image/*" multiple hidden>+ Foto</label>
</header>
<div id="prj"><select id="psel" aria-label="Progetto"></select><button id="pnew" type="button">Nuovo</button><button id="pren" type="button">Rinomina</button><button id="pdel" type="button">Elimina</button></div>
<div id="pedit" hidden><input id="pname" maxlength="40" placeholder="Nome del progetto"><button id="pok" type="button">OK</button><button id="pno" type="button">Annulla</button></div>
<div id="imp" hidden><div id="impt"></div><div id="impb"><div id="impf"></div></div></div>
<div id="stage"><video id="v" playsinline></video><img id="ph" alt="" hidden><div id="wait"><div id="nx"></div><button id="nxbtn" type="button">Avvia prossimo ▶</button></div></div>
<div id="prog" aria-label="Avanzamento"><div id="pf"></div></div>
<div id="bar"><span id="now">Nessun video in riproduzione</span><span id="tm">0:00 / 0:00</span><button id="mu" type="button" aria-label="Audio">🔊</button></div>
<div id="ctl"><button id="pp" type="button">Pausa</button><button id="pdur" type="button" title="Durata foto">Foto: ∞</button><button id="cap" type="button">Anteprima</button><button id="delcur" type="button" aria-label="Elimina selezionato o trascina qui per eliminare" title="Elimina selezionato o trascina qui" disabled>🗑️</button></div>
<div id="listwrap">
  <div id="list"></div>
  <div id="zrail" role="slider" aria-label="Dimensione miniature" aria-valuemin="60" aria-valuemax="260" aria-valuenow="130" tabindex="0">
    <div id="ztrack"><div id="zfill"></div><div id="zthumb"></div></div>
  </div>
</div>
<div id="foot"><button id="go" type="button">Avvia</button></div>

<script>
(function(){
// Blocca zoom pagina del browser (pinch-to-zoom, doppio tap, gesti Safari/iOS, Ctrl+rotella) e menu contestuale
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
document.addEventListener("gesturechange",function(e){e.preventDefault();},{passive:false});
document.addEventListener("gestureend",function(e){e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",function(e){if(!e.target.closest("input,select,textarea"))e.preventDefault();});
document.addEventListener("selectstart",function(e){if(!e.target.closest("input,select,textarea"))e.preventDefault();});
document.addEventListener("touchmove",function(e){
  if(e.touches.length>1){e.preventDefault();return;}
  if(!e.target.closest("#list,#zrail,#prog"))e.preventDefault();
},{passive:false});
var lastTouchEnd=0;
document.addEventListener("touchend",function(e){
  var nowT=Date.now();
  if(nowT-lastTouchEnd<=300&&!e.target.closest("input,select,textarea")){e.preventDefault();}
  lastTouchEnd=nowT;
},{passive:false});
document.addEventListener("wheel",function(e){if(e.ctrlKey||e.metaKey)e.preventDefault();},{passive:false});

var list=document.getElementById("list"),v=document.getElementById("v"),now=document.getElementById("now"),inp=document.getElementById("file"),prog=document.getElementById("prog"),pf=document.getElementById("pf"),tm=document.getElementById("tm"),go=document.getElementById("go"),wait=document.getElementById("wait"),ord=document.getElementById("ord"),cap=document.getElementById("cap"),pp=document.getElementById("pp"),ph=document.getElementById("ph"),ap=document.getElementById("ap"),nx=document.getElementById("nx"),nxbtn=document.getElementById("nxbtn"),pdur=document.getElementById("pdur"),delcur=document.getElementById("delcur");
var items=[],cur=-1,db=null,queue=[],busy=false,sorting=false,imp={t:0,d:0},projs=[],pid="p1";
var photoDurs=[0,3,5,8],photoDurIdx=0,photoTimer=null,photoPaused=false,photoElapsed=0,photoStart=0;
try{projs=JSON.parse(localStorage.getItem("vpprojects")||"[]");pid=localStorage.getItem("vpcur")||"p1";}catch(e){}
if(!projs.length)projs=[{id:"p1",name:"Progetto 1"}];
if(!projs.some(function(p){return p.id===pid;}))pid=projs[0].id;
try{var savedPdur=parseInt(localStorage.getItem("vppdur")||"0",10);var di=photoDurs.indexOf(savedPdur);if(di>=0)photoDurIdx=di;}catch(e){}
function updatePdurBtn(){var d=photoDurs[photoDurIdx];pdur.textContent="Foto: "+(d?d+"s":"∞");}
updatePdurBtn();
pdur.addEventListener("click",function(){
  photoDurIdx=(photoDurIdx+1)%photoDurs.length;
  try{localStorage.setItem("vppdur",String(photoDurs[photoDurIdx]));}catch(e){}
  updatePdurBtn();
  if(cur>=0&&items[cur]&&items[cur].kind==="photo")startPhotoMode();
});

function clearPhotoTimer(){
  if(photoTimer){clearInterval(photoTimer);photoTimer=null;}
  photoElapsed=0;photoPaused=false;
}
function startPhotoMode(){
  clearPhotoTimer();
  var d=photoDurs[photoDurIdx];
  if(!d){pf.style.width="0%";tm.textContent="Foto (manuale)";pp.disabled=true;pp.textContent="Pausa";return;}
  pp.disabled=false;pp.textContent="Pausa";photoPaused=false;photoElapsed=0;photoStart=Date.now();
  tm.textContent="0:00 / "+fmt(d);pf.style.width="0%";
  photoTimer=setInterval(function(){
    if(photoPaused)return;
    photoElapsed=(Date.now()-photoStart)/1000;
    if(photoElapsed>=d){
      clearPhotoTimer();
      pf.style.width="100%";tm.textContent=fmt(d)+" / "+fmt(d);
      setWait(true);
      return;
    }
    pf.style.width=(photoElapsed/d*100)+"%";
    tm.textContent=fmt(photoElapsed)+" / "+fmt(d);
  },120);
}

function openDB(cb){
  try{
    var r=indexedDB.open("videoplayer",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("v",{keyPath:"id"});};
    r.onsuccess=function(){db=r.result;cb();};
    r.onerror=function(){cb();};
  }catch(e){cb();}
}
function put(it,cb){
  if(!db){if(cb)cb();return;}
  try{
    var tx=db.transaction("v","readwrite");
    tx.objectStore("v").put({id:it.id,name:it.name,blob:it.blob,thumb:it.thumb,order:it.order,tv:it.tv||0,pid:it.pid||"p1",kind:it.kind||"video"});
    if(cb){tx.oncomplete=cb;tx.onerror=cb;tx.onabort=cb;}
  }catch(e){if(cb)cb();}
}
function del(id){
  if(!db)return;
  try{db.transaction("v","readwrite").objectStore("v").delete(id);}catch(e){}
}
function purgeProjectDB(targetPid,cb){
  if(!db){if(cb)cb();return;}
  try{
    var tx=db.transaction("v","readwrite");
    var store=tx.objectStore("v");
    var req=store.openCursor();
    req.onsuccess=function(){
      var curC=req.result;
      if(curC){
        if((curC.value.pid||"p1")===targetPid)curC.delete();
        curC.continue();
      }
    };
    if(cb){tx.oncomplete=cb;tx.onerror=cb;}
  }catch(e){if(cb)cb();}
}
function loadAll(){
  if(!db){render();return;}
  try{
    var q=db.transaction("v").objectStore("v").getAll();
    q.onsuccess=function(){
      var sv=[];try{sv=JSON.parse(localStorage.getItem("vporder-"+pid)||localStorage.getItem("vporder")||"[]");}catch(e){}
      function rk(r){var k=sv.indexOf(r.id);return k<0?1e9+r.order:k;}
      q.result.filter(function(r){return (r.pid||"p1")===pid;}).sort(function(a,b){return rk(a)-rk(b);}).forEach(function(r){
        var it={id:r.id,name:r.name,blob:r.blob,thumb:r.thumb||"",order:r.order,tv:r.tv||0,pid:pid,kind:r.kind||"video",url:URL.createObjectURL(r.blob)};
        items.push(it);if(it.tv<3)queue.push(it);
      });
      loadNums();render();pump();
    };
    q.onerror=render;
  }catch(e){render();}
}

function makeThumb(it,cb){
  var t=document.createElement("video"),done=false,times=[],k=0,best="",bs=-1;
  function fin(){if(done)return;done=true;try{t.pause();t.removeAttribute("src");t.load();if(t.parentNode)t.parentNode.removeChild(t);}catch(e){}cb(bs>=12?best:"");}
  function score(){
    try{
      var c=document.createElement("canvas");c.width=48;c.height=27;
      var x=c.getContext("2d");x.drawImage(t,0,0,48,27);
      var d=x.getImageData(0,0,48,27).data,s=0,s2=0,n=d.length/4;
      for(var i=0;i<d.length;i+=4){var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];s+=l;s2+=l*l;}
      var m=s/n;return m+Math.sqrt(Math.max(0,s2/n-m*m));
    }catch(e){return 0;}
  }
  function grab(){
    var w=240,h=Math.round(w*t.videoHeight/t.videoWidth)||135,c=document.createElement("canvas");
    c.width=w;c.height=h;c.getContext("2d").drawImage(t,0,0,w,h);
    return c.toDataURL("image/jpeg",0.6);
  }
  function next(){
    if(k>=times.length){fin();return;}
    try{t.currentTime=times[k++];}catch(e){fin();}
  }
  t.muted=true;t.defaultMuted=true;t.setAttribute("muted","");t.setAttribute("playsinline","");t.playsInline=true;t.preload="auto";
  t.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none";
  document.body.appendChild(t);
  var started=false;
  function start(){
    if(started||done)return;started=true;
    var d=t.duration;
    times=(isFinite(d)&&d>0)?[0.05,0.15,0.3,0.5,0.7,0.85].map(function(f){return d*f;}):[0.5];
    next();
  }
  t.onloadedmetadata=function(){
    var p;try{p=t.play();}catch(e){}
    if(p&&p.then)p.then(function(){t.pause();start();},function(){start();});else start();
  };
  t.onseeked=function(){
    var ok=false;
    function check(){
      if(ok)return;ok=true;
      try{var sc=score();if(sc>bs){bs=sc;best=grab();}}catch(e){}
      if(bs>90){fin();return;}
      next();
    }
    if(t.requestVideoFrameCallback){t.requestVideoFrameCallback(check);setTimeout(check,700);}
    else setTimeout(check,350);
  };
  t.onerror=function(){fin();};
  setTimeout(fin,20000);
  t.src=it.url;
}
function photoThumb(it,cb){
  var im=new Image(),done=false;
  function fin(d){if(done)return;done=true;cb(d||"");}
  im.onload=function(){
    try{
      var w=240,h=Math.round(w*im.naturalHeight/im.naturalWidth)||135,c=document.createElement("canvas");
      c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
      fin(c.toDataURL("image/jpeg",0.7));
    }catch(e){fin();}
  };
  im.onerror=function(){fin();};
  setTimeout(fin,10000);
  im.src=it.url;
}
function pump(){
  if(busy||!queue.length)return;
  busy=true;
  var it=queue.shift();
  (it.kind==="photo"?photoThumb:makeThumb)(it,function(d){it.thumb=d;it.tv=3;if(!it.gone)put(it);if(it.cnt){it.cnt=false;step();}busy=false;render();pump();});
}

function render(){
  if(drag){return;}
  updateGo();
  delcur.disabled=(cur<0||cur>=items.length);
  list.innerHTML="";
  if(!items.length){
    var h=document.createElement("div");h.className="hint";
    h.textContent="Nessun elemento. Usa “+ Video” o “+ Foto” per aggiungerne.";
    list.appendChild(h);return;
  }
  items.forEach(function(it,i){
    var t=document.createElement("div");t.className="tile"+(i===cur?" on":"");t.dataset.i=i;
    var th=document.createElement("div");th.className="th";
    if(it.thumb)th.style.backgroundImage="url("+it.thumb+")";
    if(!it.thumb){var hh=0;for(var q=0;q<it.name.length;q++)hh=(hh*31+it.name.charCodeAt(q))%360;th.style.backgroundColor="hsl("+hh+",35%,32%)";}
    th.textContent=it.kind==="photo"?(it.thumb?"":"🖼"):"▶";
    var nm=document.createElement("div");nm.className="nm";nm.textContent=it.name;
    t.onclick=function(){if(!sorting&&!justDragged)play(i);};
    t.appendChild(th);t.appendChild(nm);
    var nb=document.createElement("div");nb.className="num";nb.textContent=nums[it.id]||"";t.appendChild(nb);
    if(sorting){
      var a=document.createElement("button");a.className="mv l";a.textContent="←";a.onclick=function(e){e.stopPropagation();move(i,-1);};
      var b=document.createElement("button");b.className="mv r";b.textContent="→";b.onclick=function(e){e.stopPropagation();move(i,1);};
      t.appendChild(a);t.appendChild(b);
    }
    list.appendChild(t);
  });
}

function play(i){
  if(i<0||i>=items.length)return;
  cur=i;
  clearPhotoTimer();
  setWait(false);
  if(items[i].kind==="photo"){
    v.pause();v.removeAttribute("src");v.load();v.hidden=true;
    ph.src=items[i].url;ph.hidden=false;
    startPhotoMode();
  }else{
    ph.hidden=true;ph.removeAttribute("src");v.hidden=false;pp.disabled=false;
    v.src=items[i].url;
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  }
  now.textContent="In riproduzione: "+items[i].name;
  render();
  var on=list.querySelector(".tile.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function fmt(s){if(!isFinite(s))s=0;var m=Math.floor(s/60),x=Math.floor(s%60);return m+":"+(x<10?"0":"")+x;}
function updateGo(){
  var nextIdx=cur<0?0:cur+1;
  var hasNext=items.length>0&&nextIdx<items.length;
  go.disabled=!hasNext;
  if(!items.length){go.textContent="Avvia";return;}
  if(!hasNext){go.textContent="Fine elenco ("+items.length+"/"+items.length+")";return;}
  go.textContent=(cur<0?"Avvia":"Continua")+" ("+(nextIdx+1)+"/"+items.length+")";
}
function setWait(on){
  wait.classList.toggle("on",on);
  document.body.classList.toggle("waiting",on);
  if(on){
    var hasNext=cur+1<items.length;
    nx.textContent=hasNext?"Prossimo: "+items[cur+1].name:"Fine dell’elenco";
    nxbtn.hidden=!hasNext;
  }
}
nxbtn.addEventListener("click",function(){play(cur+1);});
v.addEventListener("ended",function(){setWait(true);});
v.addEventListener("timeupdate",function(){
  pf.style.width=(v.duration?v.currentTime/v.duration*100:0)+"%";
  tm.textContent=fmt(v.currentTime)+" / "+fmt(v.duration);
});
v.addEventListener("click",function(){
  if(!v.getAttribute("src"))return;
  if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}else v.pause();
});
function seek(e){
  if(cur>=0&&items[cur]&&items[cur].kind==="photo"){
    var d=photoDurs[photoDurIdx];
    if(!d)return;
    var r=prog.getBoundingClientRect();
    var frac=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    photoElapsed=frac*d;photoStart=Date.now()-photoElapsed*1000;
    pf.style.width=(frac*100)+"%";tm.textContent=fmt(photoElapsed)+" / "+fmt(d);
    return;
  }
  if(!isFinite(v.duration)||!v.duration)return;
  var r=prog.getBoundingClientRect();
  v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v.duration;
}
prog.addEventListener("pointerdown",function(e){prog.setPointerCapture(e.pointerId);seek(e);});
prog.addEventListener("pointermove",function(e){if(prog.hasPointerCapture(e.pointerId))seek(e);});
go.addEventListener("click",function(){play(cur<0?0:cur+1);});
function saveOrder(){try{localStorage.setItem("vporder-"+pid,JSON.stringify(items.map(function(x){return x.id;})));}catch(e){}}
function move(i,d){
  var j=i+d;if(j<0||j>=items.length)return;
  var t=items[i];pushUndo({order:items.map(function(x){return x.id;})});items[i]=items[j];items[j]=t;
  if(cur===i)cur=j;else if(cur===j)cur=i;
  saveOrder();render();
}
ord.addEventListener("click",function(){sorting=!sorting;ord.textContent=sorting?"Fine":"Ordina";render();});
v.addEventListener("webkitplaybacktargetavailabilitychanged",function(e){ap.hidden=e.availability!=="available";});
ap.addEventListener("click",function(){try{v.webkitShowPlaybackTargetPicker();}catch(e){}});
cap.addEventListener("click",function(){
  if(cur<0||!v.videoWidth)return;
  try{
    var w=240,h=Math.round(w*v.videoHeight/v.videoWidth),c=document.createElement("canvas");
    c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
    var it=items[cur];it.thumb=c.toDataURL("image/jpeg",0.6);it.tv=3;put(it);render();
    cap.textContent="Salvata";setTimeout(function(){cap.textContent="Anteprima";},1200);
  }catch(e){}
});

function remove(i){
  if(i<0||i>=items.length)return;
  var it=items[i];
  pushUndo({del:it,index:i});it.gone=true;
  try{URL.revokeObjectURL(it.url);}catch(e){}
  del(it.id);
  if(i===cur){clearPhotoTimer();setWait(false);v.pause();v.removeAttribute("src");v.load();ph.hidden=true;ph.removeAttribute("src");v.hidden=false;pp.disabled=false;pp.textContent="Pausa";cur=-1;now.textContent="Nessun video in riproduzione";tm.textContent="0:00 / 0:00";pf.style.width="0%";}
  else if(i<cur)cur--;
  items.splice(i,1);saveOrder();render();
}
delcur.addEventListener("click",function(){
  if(cur>=0&&cur<items.length)remove(cur);
});

function addFiles(inp,kind){
  var files=Array.prototype.slice.call(inp.files||[]),base=Date.now();
  imp.t+=files.length*2;showImp();
  files.forEach(function(f,k){
    var it={id:base+"-"+k,name:f.name.replace(/\.[^.]+$/,""),blob:f,url:URL.createObjectURL(f),thumb:"",order:base+k,pid:pid,kind:kind,cnt:true};
    nums[it.id]=nextNum();
    items.push(it);put(it,step);queue.push(it);
  });
  inp.value="";
  saveOrder();saveNums();
  render();pump();
}
inp.addEventListener("change",function(){addFiles(inp,"video");});
var inpp=document.getElementById("filep");
inpp.addEventListener("change",function(){addFiles(inpp,"photo");});

function showImp(){
  var e=document.getElementById("imp");
  if(imp.t<=imp.d){e.hidden=true;imp.t=0;imp.d=0;return;}
  e.hidden=false;
  document.getElementById("impf").style.width=(imp.d/imp.t*100)+"%";
  document.getElementById("impt").textContent="Importazione in corso: "+Math.floor(imp.d/2)+" / "+Math.round(imp.t/2)+" elementi";
}
function step(){imp.d++;showImp();}
pp.addEventListener("click",function(){
  if(cur>=0&&items[cur]&&items[cur].kind==="photo"){
    if(!photoDurs[photoDurIdx])return;
    photoPaused=!photoPaused;
    if(!photoPaused)photoStart=Date.now()-photoElapsed*1000;
    pp.textContent=photoPaused?"Riprendi":"Pausa";
    return;
  }
  if(!v.getAttribute("src"))return;
  if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}else v.pause();
});
v.addEventListener("play",function(){if(!(cur>=0&&items[cur]&&items[cur].kind==="photo"))pp.textContent="Pausa";});
v.addEventListener("pause",function(){if(!(cur>=0&&items[cur]&&items[cur].kind==="photo"))pp.textContent="Riprendi";});
v.addEventListener("ended",function(){pp.textContent="Pausa";});
var psel=document.getElementById("psel"),pedit=document.getElementById("pedit"),pname=document.getElementById("pname"),pdel=document.getElementById("pdel"),pmode="",armed=false;
function saveProj(){try{localStorage.setItem("vpprojects",JSON.stringify(projs));localStorage.setItem("vpcur",pid);}catch(e){}}
function fillProj(){psel.innerHTML="";projs.forEach(function(p){var o=document.createElement("option");o.value=p.id;o.textContent=p.name;psel.appendChild(o);});psel.value=pid;}
function openProject(id){
  clearPhotoTimer();
  items.forEach(function(it){try{if(it.url)URL.revokeObjectURL(it.url);}catch(e){}});
  items=[];queue=[];cur=-1;sorting=false;ord.textContent="Ordina";undo=[];updUndo();
  v.pause();v.removeAttribute("src");v.load();ph.hidden=true;ph.removeAttribute("src");v.hidden=false;pp.disabled=false;pp.textContent="Pausa";now.textContent="Nessun video in riproduzione";tm.textContent="0:00 / 0:00";pf.style.width="0%";setWait(false);
  pid=id;saveProj();fillProj();render();loadAll();
}
function askName(mode,txt){pmode=mode;pname.value=txt;pedit.hidden=false;pname.focus();}
psel.addEventListener("change",function(){openProject(psel.value);});
document.getElementById("pnew").addEventListener("click",function(){askName("new","");});
document.getElementById("pren").addEventListener("click",function(){var p=projs.filter(function(x){return x.id===pid;})[0];askName("ren",p?p.name:"");});
document.getElementById("pno").addEventListener("click",function(){pedit.hidden=true;});
document.getElementById("pok").addEventListener("click",function(){
  var n=pname.value.replace(/^\s+|\s+$/g,"");if(!n)return;
  pedit.hidden=true;
  if(pmode==="new"){var id="p"+Date.now();projs.push({id:id,name:n});openProject(id);}
  else{projs.forEach(function(p){if(p.id===pid)p.name=n;});saveProj();fillProj();}
});
pdel.addEventListener("click",function(){
  if(projs.length<2){pdel.textContent="Serve un altro";setTimeout(function(){pdel.textContent="Elimina";},1500);return;}
  if(!armed){armed=true;pdel.textContent="Conferma?";setTimeout(function(){armed=false;pdel.textContent="Elimina";},3000);return;}
  armed=false;pdel.textContent="Elimina";
  var gone=pid;
  purgeProjectDB(gone);
  try{localStorage.removeItem("vporder-"+gone);localStorage.removeItem("vpnums-"+gone);}catch(e){}
  projs=projs.filter(function(p){return p.id!==gone;});
  openProject(projs[0].id);
});
var tw=130,TW_MIN=60,TW_MAX=260;
var zrail=document.getElementById("zrail"),ztrack=document.getElementById("ztrack"),zfill=document.getElementById("zfill"),zthumb=document.getElementById("zthumb");
try{tw=parseInt(localStorage.getItem("vptw"),10)||130;}catch(e){}
function setTw(x){
  tw=Math.max(TW_MIN,Math.min(TW_MAX,Math.round(x)));
  list.style.setProperty("--tw",tw+"px");
  var pct=((tw-TW_MIN)/(TW_MAX-TW_MIN))*100;
  if(zfill)zfill.style.height=pct+"%";
  if(zthumb)zthumb.style.bottom=pct+"%";
  if(zrail)zrail.setAttribute("aria-valuenow",String(tw));
}
function saveTw(){try{localStorage.setItem("vptw",String(tw));}catch(e){}}
setTw(tw);
function seekZoom(clientY){
  var r=ztrack.getBoundingClientRect();
  if(!r.height)return;
  var frac=1-Math.max(0,Math.min(1,(clientY-r.top)/r.height));
  setTw(TW_MIN+frac*(TW_MAX-TW_MIN));
}
zrail.addEventListener("pointerdown",function(e){e.preventDefault();zrail.setPointerCapture(e.pointerId);seekZoom(e.clientY);});
zrail.addEventListener("pointermove",function(e){if(zrail.hasPointerCapture(e.pointerId))seekZoom(e.clientY);});
zrail.addEventListener("pointerup",function(e){if(zrail.hasPointerCapture(e.pointerId)){zrail.releasePointerCapture(e.pointerId);saveTw();}});
zrail.addEventListener("pointercancel",function(){saveTw();});
zrail.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"||e.key==="ArrowRight"){e.preventDefault();setTw(tw+10);saveTw();}
  else if(e.key==="ArrowDown"||e.key==="ArrowLeft"){e.preventDefault();setTw(tw-10);saveTw();}
});

var drag=null,lt=null,lx=0,ly=0,st0=0,justDragged=false;
function isOverTrash(clientX,clientY){
  var tr=delcur.getBoundingClientRect();
  var pad=16;
  return clientX>=tr.left-pad&&clientX<=tr.right+pad&&clientY>=tr.top-pad&&clientY<=tr.bottom+pad;
}
function beginDrag(tl,clientX,clientY){
  if(!tl||sorting)return;
  drag={i:parseInt(tl.dataset.i,10),el:tl,over:-1,trash:false};
  lx=clientX;ly=clientY;
  st0=list.scrollTop;
  tl.classList.add("drag");
  document.body.classList.add("dragging");
}
function moveDrag(clientX,clientY){
  if(!drag)return;
  var overTrash=isOverTrash(clientX,clientY);
  drag.trash=overTrash;
  delcur.classList.toggle("hot",overTrash);
  drag.el.classList.toggle("trash",overTrash);
  var r=list.getBoundingClientRect();
  if(!overTrash){
    if(clientY<r.top+50&&clientY>=r.top)list.scrollTop-=14;
    else if(clientY>r.bottom-50&&clientY<=r.bottom)list.scrollTop+=14;
  }
  drag.el.style.transform="translate("+(clientX-lx)+"px,"+(clientY-ly+list.scrollTop-st0)+"px) scale("+(overTrash?0.68:1.05)+")";
  var prev=list.querySelector(".tgt");
  if(overTrash){
    if(prev)prev.classList.remove("tgt");
    drag.over=-1;
    return;
  }
  var el=document.elementFromPoint(clientX,clientY),tl=el&&el.closest?el.closest(".tile"):null;
  if(prev&&prev!==tl)prev.classList.remove("tgt");
  if(tl&&tl!==drag.el){tl.classList.add("tgt");drag.over=parseInt(tl.dataset.i,10);}else if(!tl){drag.over=-1;}
}
function endDrag(apply){
  clearTimeout(lt);
  if(!drag)return;
  var d=drag;drag=null;
  document.body.classList.remove("dragging");
  delcur.classList.remove("hot");
  d.el.classList.remove("drag","trash");d.el.style.transform="";
  var all=list.querySelectorAll(".tgt");for(var n=0;n<all.length;n++)all[n].classList.remove("tgt");
  justDragged=true;setTimeout(function(){justDragged=false;},450);
  if(apply&&d.trash){
    remove(d.i);
    return;
  }
  if(apply&&d.over>=0&&d.over!==d.i){
    var curItem=cur>=0?items[cur]:null;
    pushUndo({order:items.map(function(x){return x.id;})});
    var moved=items.splice(d.i,1)[0];items.splice(d.over,0,moved);
    cur=curItem?items.indexOf(curItem):-1;
    saveOrder();
  }
  render();
}
list.addEventListener("touchstart",function(e){
  clearTimeout(lt);
  if(e.touches.length!==1){if(drag)endDrag(false);return;}
  var tl=e.target.closest?e.target.closest(".tile"):null;
  if(!tl)return;
  var t=e.touches[0];lx=t.clientX;ly=t.clientY;
  lt=setTimeout(function(){beginDrag(tl,t.clientX,t.clientY);},380);
},{passive:true});
list.addEventListener("touchmove",function(e){
  var t=e.touches[0];
  if(!drag){if(Math.abs(t.clientX-lx)>10||Math.abs(t.clientY-ly)>10)clearTimeout(lt);return;}
  e.preventDefault();
  moveDrag(t.clientX,t.clientY);
},{passive:false});
list.addEventListener("touchend",function(){endDrag(true);clearTimeout(lt);});
list.addEventListener("touchcancel",function(){endDrag(false);});
list.addEventListener("mousedown",function(e){
  if(e.button!==0||e.target.closest("button"))return;
  var tl=e.target.closest?e.target.closest(".tile"):null;
  if(!tl)return;
  lx=e.clientX;ly=e.clientY;
  lt=setTimeout(function(){beginDrag(tl,e.clientX,e.clientY);},380);
});
window.addEventListener("mousemove",function(e){
  if(!drag){if(lt&&(Math.abs(e.clientX-lx)>10||Math.abs(e.clientY-ly)>10))clearTimeout(lt);return;}
  moveDrag(e.clientX,e.clientY);
});
window.addEventListener("mouseup",function(){
  clearTimeout(lt);
  if(drag)endDrag(true);
});

var nums={};
function saveNums(){try{localStorage.setItem("vpnums-"+pid,JSON.stringify(nums));}catch(e){}}
function nextNum(){var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];return mx+1;}
function loadNums(){
  try{nums=JSON.parse(localStorage.getItem("vpnums-"+pid)||"{}");}catch(e){nums={};}
  var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];
  items.slice().sort(function(a,b){return a.order-b.order;}).forEach(function(it){if(!nums[it.id])nums[it.id]=++mx;});
  saveNums();
}
var mu=document.getElementById("mu");
function applyMute(){mu.textContent=v.muted?"🔇":"🔊";mu.classList.toggle("on",v.muted);}
try{v.muted=localStorage.getItem("vpmute")==="1";}catch(e){}
applyMute();
mu.addEventListener("click",function(){v.muted=!v.muted;try{localStorage.setItem("vpmute",v.muted?"1":"0");}catch(e){}applyMute();});
v.addEventListener("volumechange",applyMute);
var undo=[],und=document.getElementById("und");
function updUndo(){und.disabled=!undo.length;und.textContent="↶ Annulla"+(undo.length?" ("+undo.length+")":"");}
function pushUndo(e){undo.push(e);if(undo.length>50){var dropped=undo.shift();if(dropped&&dropped.del&&dropped.del.gone&&dropped.del.url){try{URL.revokeObjectURL(dropped.del.url);}catch(err){}}}updUndo();}
function doUndo(){
  var e=undo.pop();if(!e)return;
  var curItem=cur>=0?items[cur]:null;
  if(e.del){
    var it=e.del;it.gone=false;it.url=URL.createObjectURL(it.blob);
    items.splice(Math.min(e.index,items.length),0,it);
    put(it);
  }else if(e.order){
    var byId={};items.forEach(function(x){byId[x.id]=x;});
    var out=[];e.order.forEach(function(id){if(byId[id]){out.push(byId[id]);delete byId[id];}});
    items.forEach(function(x){if(byId[x.id])out.push(x);});
    items=out;
  }
  cur=curItem?items.indexOf(curItem):-1;
  saveOrder();updUndo();render();
}
und.addEventListener("click",doUndo);
updUndo();
fillProj();openDB(loadAll);
})();
</script>
