<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>ArnoShow</title>
<style>
:root{--bg:#000000;--fg:#f5f5f3;--mut:#9a9a94;--card:#161616;--line:#2e2e2c;--acc:#6b9bff;--del:#ef4444;--sat:max(env(safe-area-inset-top,0px),62px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark;box-sizing:border-box}
:root[data-theme="gray"]{--bg:#525256;--fg:#f5f5f3;--mut:#d4d4d8;--card:#3f3f44;--line:#68686e;--acc:#6b9bff;--del:#ef4444;color-scheme:dark}
:root[data-theme="white"]{--bg:#f4f4f2;--fg:#1b1b1a;--mut:#6b6b66;--card:#ffffff;--line:#d6d6d0;--acc:#2f6fed;--del:#dc2626;color-scheme:light}
:root[data-theme="photo"]{--bg:#0b0b0c;--fg:#ffffff;--mut:#e4e4e7;--card:rgba(18,18,22,0.72);--line:rgba(255,255,255,0.22);--acc:#6b9bff;--del:#ef4444;color-scheme:dark}
#bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s ease}
:root[data-theme="photo"] #bgimg.on{opacity:1}
#bgdim{position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(0,0,0,0.42);opacity:0;transition:opacity .25s ease}
:root[data-theme="photo"] #bgdim.on{opacity:1}
:root[data-theme="photo"] .btn.sec,:root[data-theme="photo"] #prj select,:root[data-theme="photo"] #prj button,:root[data-theme="photo"] #pedit,:root[data-theme="photo"] #imp,:root[data-theme="photo"] #cap,:root[data-theme="photo"] #pdur,:root[data-theme="photo"] #cont,:root[data-theme="photo"] #delcur,:root[data-theme="photo"] #mu,:root[data-theme="photo"] .tile{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header,#prj,#pedit,#imp,#stage,#prog,#bar,#ctl,#listwrap,#foot{position:relative;z-index:2}
*,*::before,*::after{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important;-webkit-user-drag:none}
input,select,textarea{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{margin:0;padding-top:var(--sat);padding-bottom:var(--sab);background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* Barra superiore ridisegnata con pulsanti vettoriali nitidi ad alta definizione */
header{position:relative;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px 6px;touch-action:none}
.brand{display:inline-flex;align-items:center;gap:8px;flex:1;min-width:110px;margin:0;padding:0;height:32px;color:var(--fg);text-decoration:none}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc) 0%,#1d4ed8 100%);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.brand-mark svg{width:16px;height:16px;display:block}
.brand-text{font-size:18px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:var(--fg);display:inline-flex;align-items:baseline}
.brand-text span{color:var(--acc)}
.btn{
  appearance:none;-webkit-appearance:none;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:32px;padding:0 11px;border-radius:10px;border:0;
  background:var(--acc);color:#ffffff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:13px;font-weight:600;line-height:1;letter-spacing:-0.01em;
  white-space:nowrap;cursor:pointer;touch-action:manipulation;
  box-shadow:0 1px 2px rgba(0,0,0,.14);
  transition:transform .1s ease,background-color .15s ease
}
.btn:active:not(:disabled){transform:scale(.96)}
.btn svg{width:14px;height:14px;flex:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn.sec.active{background:var(--acc);color:#fff;border-color:var(--acc)}
@keyframes pulseRed{
  0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--del) 55%,transparent),0 2px 8px color-mix(in srgb,var(--del) 45%,transparent)}
  50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--del) 20%,transparent),0 2px 12px color-mix(in srgb,var(--del) 65%,transparent)}
}
.btn.danger{background:var(--del);color:#fff;border:0;animation:pulseRed 1.4s ease-in-out infinite}
.btn:disabled{background:var(--line);color:var(--mut);border:1px solid transparent;box-shadow:none;cursor:default}

video,#ph{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:auto}
#audvis{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--acc) 32%,#121216) 0%,#08080a 85%);color:#fff;padding:12px;box-sizing:border-box;text-align:center}
#audvis .av-ico{font-size:38px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
#audvis .av-nm{font-size:13px;font-weight:700;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
#bar{display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:13px;color:var(--mut);touch-action:none}
#now{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#prog{height:12px;margin:5px 10px 0;background:var(--line);border-radius:6px;overflow:hidden;touch-action:none;cursor:pointer}
#pf{height:100%;width:0;background:var(--acc);pointer-events:none}
#tm{font-variant-numeric:tabular-nums;white-space:nowrap}
[hidden]{display:none!important}
#ctl{display:flex;gap:6px;padding:0 10px 5px;flex-wrap:wrap;touch-action:none;position:relative;z-index:30}
#delcur{order:-1;font-size:17px;padding:0 13px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .14s ease,background-color .14s ease,border-color .14s ease,box-shadow .14s ease}
#delcur:disabled{opacity:.35}
body.dragging #delcur{opacity:1!important;border-color:var(--del);background:color-mix(in srgb,var(--del) 14%,var(--card));transform:scale(1.06)}
body.dragging #delcur.hot{background:var(--del);border-color:var(--del);color:#fff;transform:scale(1.22);box-shadow:0 0 0 4px color-mix(in srgb,var(--del) 30%,transparent)}
#pp{flex:1;min-width:80px;height:38px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;font-family:inherit;touch-action:manipulation}
#cap,#pdur,#cont{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:0 10px;font-size:12px;font-family:inherit;height:38px;touch-action:manipulation;font-weight:600}
#cont.on{background:var(--acc);border-color:var(--acc);color:#fff}
#prj,#pedit{display:flex;gap:5px;padding:0 10px 5px;align-items:center;touch-action:none}
#prj select,#pedit input{flex:1;min-width:0;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;touch-action:manipulation}
#prj button,#pedit button{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:12px;font-family:inherit;touch-action:manipulation}
#imp{padding:0 10px 5px;font-size:12px;color:var(--mut);touch-action:none}
#impb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
#impf{height:100%;width:0;background:var(--acc)}
#foot{position:relative;z-index:10;padding:12px 10px 4px;display:flex;align-items:center;justify-content:center;touch-action:none}
#go{width:88px;height:88px;padding:0;border:0;border-radius:50%;background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);color:#fff;font-size:16px;font-weight:800;line-height:1.12;letter-spacing:-0.01em;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 14px rgba(234,88,12,.42);transition:transform .1s ease,opacity .15s ease;touch-action:manipulation}
#go:active:not(:disabled){transform:scale(.95)}
#go .go-sub{font-size:12.5px;font-weight:700;opacity:.92;margin-top:3px}
#go:disabled{opacity:.35;box-shadow:none}

@keyframes playPulse{
  0%,100%{border-color:var(--del);box-shadow:0 0 0 2px color-mix(in srgb,var(--del) 75%,transparent),0 0 14px color-mix(in srgb,var(--del) 60%,transparent)}
  50%{border-color:color-mix(in srgb,var(--del) 20%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--del) 15%,transparent),0 0 3px transparent}
}
#stage{position:relative;background:#000;flex:none;overflow:hidden;width:68%;height:20.5vh;margin:8px auto 0;border-radius:10px;border:3px solid transparent;box-sizing:border-box;touch-action:none;transition:border-color .2s ease}
#stage.playing{animation:playPulse 1.1s ease-in-out infinite}

#wait{display:none;position:absolute;inset:0;background:#000}
#wait.on{display:block}
.num{position:absolute;left:6px;top:2px;z-index:2;pointer-events:none;font-weight:800;line-height:1.1;font-size:clamp(16px,calc(var(--tw,130px)*.3),44px);color:#fff;text-shadow:0 0 5px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.95)}
#mu{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px 7px;font-size:16px;line-height:1.2;touch-action:manipulation}
#mu.on{background:var(--acc);border-color:var(--acc)}

#listwrap{flex:1 1 0;min-height:0;display:flex;align-items:stretch;overflow:hidden;touch-action:none}
#list{flex:1 1 0;min-width:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));grid-auto-rows:max-content;touch-action:pan-y;gap:8px;padding:8px 10px 8px 6px;align-content:start;align-items:start}
#zrail{order:-1;flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 8px 10px;touch-action:none;cursor:ns-resize}
#ztrack{position:relative;width:12px;height:100%;max-height:240px;min-height:80px;background:var(--line);border-radius:99px}
#zfill{position:absolute;left:0;right:0;bottom:0;background:var(--acc);border-radius:99px;pointer-events:none}
#zthumb{position:absolute;left:50%;width:30px;height:30px;border-radius:50%;background:var(--acc);border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,50%);pointer-events:none}

.tile{position:relative;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--mut);box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:12px;overflow:hidden;cursor:pointer;min-width:0}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.drag{z-index:40;pointer-events:none;opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:border-color .12s ease,opacity .12s ease}
.tile.drag.trash{border-color:var(--del);opacity:.78}
.tile.tgt{outline:3px dashed var(--acc);outline-offset:2px}
.th{position:relative;width:100%;aspect-ratio:16/9;flex:none;background:#2a2a2a center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;pointer-events:none}
@supports not (aspect-ratio:16/9){.th{height:0;padding-top:56.25%}.th>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}}
.nm{padding:5px 7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hint{grid-column:1/-1;color:var(--mut);text-align:center;padding:24px 10px}

/* Adattamento nativo a due colonne in orientamento orizzontale (landscape) con finestra video 16:9 bilanciata */
@media screen and (orientation:landscape) and (max-height:600px){
  body{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto 1fr auto auto auto auto 1fr;
    grid-template-areas:
      "hdr prj"
      ". list"
      "stage list"
      "prog list"
      "bar ctl"
      "bar foot"
      ". foot";
    padding-top:max(env(safe-area-inset-top,0px),6px);
    padding-bottom:max(env(safe-area-inset-bottom,0px),6px);
    padding-left:max(env(safe-area-inset-left,0px),12px);
    padding-right:max(env(safe-area-inset-right,0px),12px);
    column-gap:12px;
  }
  header{grid-area:hdr;padding:2px 2px 4px;gap:4px;flex-wrap:nowrap;overflow-x:auto;min-width:0}
  .brand{min-width:0;flex:1;gap:6px;height:28px}
  .brand-mark{width:24px;height:24px;border-radius:7px}
  .brand-mark svg{width:14px;height:14px}
  .brand-text{font-size:15px}
  .btn{height:28px;padding:0 7px;font-size:11.5px;border-radius:8px;gap:3px}
  .btn svg{width:12px;height:12px}
  #prj{grid-area:prj;padding:2px 2px 4px;gap:4px;min-width:0}
  #prj select{padding:2px 6px;font-size:13px;height:28px}
  #prj button{padding:0 7px;height:28px;font-size:11.5px}
  #pedit{position:fixed;right:max(env(safe-area-inset-right,0px),14px);top:42px;width:46%;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #imp{position:fixed;left:16px;right:16px;top:42px;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #stage{grid-area:stage;width:100%;height:auto;aspect-ratio:16/9;max-height:54vh;min-height:0;margin:0;border-radius:10px;align-self:center;justify-self:center}
  #prog{grid-area:prog;margin:8px 2px 0;height:10px}
  #bar{grid-area:bar;padding:4px 2px 0;font-size:12px;align-self:start}
  #mu{padding:1px 6px;font-size:14px}
  #listwrap{grid-area:list;min-height:0;height:100%;overflow:hidden}
  #list{padding:2px 4px 4px 4px;gap:6px}
  #zrail{width:38px;padding:2px 2px 2px 2px}
  #ztrack{max-height:none;height:82%}
  #zthumb{width:24px;height:24px}
  #ctl{grid-area:ctl;padding:4px 2px 0;align-items:center;flex-wrap:wrap;gap:4px}
  #delcur,#pp,#cap,#pdur,#cont{height:30px;padding:0 7px;font-size:11px;border-radius:8px}
  #delcur{padding:0 9px;font-size:14px}
  #pp{min-width:56px;font-size:12.5px}
  #foot{grid-area:foot;padding:6px 2px 0;display:flex;align-items:center;justify-content:center}
  #go{width:72px;height:72px;font-size:13.5px;border-radius:50%}
  #go .go-sub{font-size:11px;margin-top:2px}
}

</style>
</head>
<body>
<img id="bgimg" alt="" aria-hidden="true"><div id="bgdim" aria-hidden="true"></div>
<header>
<div class="brand" aria-label="ArnoShow"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c2.2-1.8 4.4-1.8 6.6 0s4.4 1.8 7.4 0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="9.5 6.5 16.5 10.5 9.5 14.5" fill="#ffffff"/></svg></span><span class="brand-text">Arno<span>Show</span></span></div>
<button class="btn danger" id="accord" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span>Accetta riordino</span></button>
<button class="btn sec" id="und" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="undt">Annulla</span></button>
<button class="btn sec" id="thm" type="button" title="Cambia tema sfondo">Sfondo: Nero</button>
<label class="btn sec" id="bgpick" title="Scegli foto di sfondo dalla libreria"><input type="file" id="bgfile" accept="image/*" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L5 21"/></svg><span>Foto sfondo</span></label>
<button class="btn sec" id="ap" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><polygon points="12 15 17 21 7 21 12 15" fill="currentColor" stroke="none"/></svg><span>AirPlay</span></button>
<label class="btn"><input type="file" id="file" accept="video/*" multiple hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Video</span></label>
<label class="btn"><input type="file" id="filep" accept="image/*" multiple hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Foto</span></label>
<label class="btn" title="Importa file audio nei vari formati (MP3, M4A, WAV, AAC, OGG, FLAC, ecc.)"><input type="file" id="filea" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus,.wma,.aiff,.aif,.caf,.alac,.amr,.3ga,.weba,.mka" multiple hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Audio</span></label>
<label class="btn" title="Carica un video ed estrae solo la sua traccia audio"><input type="file" id="fileva" accept="video/*" multiple hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Audio da video</span></label>
</header>
<div id="prj"><select id="psel" aria-label="Progetto"></select><button id="pnew" type="button">Nuovo</button><button id="pren" type="button">Rinomina</button><button id="pdel" type="button">Elimina</button></div>
<div id="pedit" hidden><input id="pname" maxlength="40" placeholder="Nome del progetto"><button id="pok" type="button">OK</button><button id="pno" type="button">Annulla</button></div>
<div id="imp" hidden><div id="impt"></div><div id="impb"><div id="impf"></div></div></div>
<div id="stage"><video id="v" playsinline></video><img id="ph" alt="" hidden><div id="audvis" hidden><div class="av-ico" id="audico">🎵</div><div class="av-nm" id="audnm"></div><div id="audsub" style="font-size:11px;opacity:.68;margin-top:2px" hidden>Traccia audio estratta da video</div></div><div id="wait"></div></div>
<div id="prog" aria-label="Avanzamento"><div id="pf"></div></div>
<div id="bar"><span id="now">Nessun video in riproduzione</span><span id="tm">0:00 / 0:00</span><button id="mu" type="button" aria-label="Audio">🔊</button></div>
<div id="ctl"><button id="pp" type="button">Pausa</button><button id="cont" type="button" title="Riproduzione continua senza sosta">Senza sosta: Off</button><button id="pdur" type="button" title="Durata foto">Durata foto: ∞</button><button id="cap" type="button">Scegli miniatura</button><button id="delcur" type="button" aria-label="Elimina selezionato o trascina qui per eliminare" title="Elimina selezionato o trascina qui" disabled>🗑️</button></div>
<div id="listwrap">
  <div id="list"></div>
  <div id="zrail" role="slider" aria-label="Dimensione miniature" aria-valuemin="60" aria-valuemax="260" aria-valuenow="130" tabindex="0">
    <div id="ztrack"><div id="zfill"></div><div id="zthumb"></div></div>
  </div>
</div>
<div id="foot"><button id="go" type="button">Avvia</button></div>

<script>
(function(){
// Blocca zoom pagina del browser (pinch-to-zoom, doppio tap, gesti Safari/iOS, Ctrl+rotella) e menu contestuale
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
document.addEventListener("gesturechange",function(e){e.preventDefault();},{passive:false});
document.addEventListener("gestureend",function(e){e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",function(e){if(!e.target.closest("input,select,textarea"))e.preventDefault();});
document.addEventListener("selectstart",function(e){if(!e.target.closest("input,select,textarea"))e.preventDefault();});
document.addEventListener("touchmove",function(e){
  if(e.touches.length>1){e.preventDefault();return;}
  if(!e.target.closest("#list,#zrail,#prog"))e.preventDefault();
},{passive:false});
var lastTouchEnd=0;
document.addEventListener("touchend",function(e){
  var nowT=Date.now();
  if(nowT-lastTouchEnd<=300&&!e.target.closest("input,select,textarea")){e.preventDefault();}
  lastTouchEnd=nowT;
},{passive:false});
document.addEventListener("wheel",function(e){if(e.ctrlKey||e.metaKey)e.preventDefault();},{passive:false});

function moveDrag(clientX,clientY){
  if(!drag)return;
  var overTrash=isOverTrash(clientX,clientY);
  drag.trash=overTrash;
  delcur.classList.toggle("hot",overTrash);
  drag.el.classList.toggle("trash",overTrash);
  var r=list.getBoundingClientRect();
  if(!overTrash){
    if(clientY<r.top+50&&clientY>=r.top)list.scrollTop-=14;
    else if(clientY>r.bottom-50&&clientY<=r.bottom)list.scrollTop+=14;
  }
  drag.el.style.transform="translate("+(clientX-lx)+"px,"+(clientY-ly+list.scrollTop-st0)+"px) scale("+(overTrash?0.68:1.05)+")";
  var prev=list.querySelector(".tgt");
  if(overTrash){
    if(prev)prev.classList.remove("tgt");
    drag.over=-1;
    return;
  }
  var el=document.elementFromPoint(clientX,clientY),tl=el&&el.closest?el.closest(".tile"):null;
  if(prev&&prev!==tl)prev.classList.remove("tgt");
  if(tl&&tl!==drag.el){tl.classList.add("tgt");drag.over=parseInt(tl.dataset.i,10);}else if(!tl){drag.over=-1;}
}
function endDrag(apply){
  clearTimeout(lt);
  if(!drag)return;
  var d=drag;drag=null;
  document.body.classList.remove("dragging");
  delcur.classList.remove("hot");
  d.el.classList.remove("drag","trash");d.el.style.transform="";
  var all=list.querySelectorAll(".tgt");for(var n=0;n<all.length;n++)all[n].classList.remove("tgt");
  justDragged=true;setTimeout(function(){justDragged=false;},450);
  if(apply&&d.trash){
    remove(d.i);
    return;
  }
  if(apply&&d.over>=0&&d.over!==d.i){
    var curItem=cur>=0?items[cur]:null;
    pushUndo({order:items.map(function(x){return x.id;})});
    var moved=items.splice(d.i,1)[0];items.splice(d.over,0,moved);
    cur=curItem?items.indexOf(curItem):-1;
    saveOrder(true);setPendingOrder(true);
  }
  render();
}
list.addEventListener("touchstart",function(e){
  clearTimeout(lt);
  if(e.touches.length!==1){if(drag)endDrag(false);return;}
  var tl=e.target.closest?e.target.closest(".tile"):null;
  if(!tl)return;
  var t=e.touches[0];lx=t.clientX;ly=t.clientY;
  lt=setTimeout(function(){beginDrag(tl,t.clientX,t.clientY);},380);
},{passive:true});
list.addEventListener("touchmove",function(e){
  var t=e.touches[0];
  if(!drag){if(Math.abs(t.clientX-lx)>10||Math.abs(t.clientY-ly)>10)clearTimeout(lt);return;}
  e.preventDefault();
  moveDrag(t.clientX,t.clientY);
},{passive:false});
list.addEventListener("touchend",function(){endDrag(true);clearTimeout(lt);});
list.addEventListener("touchcancel",function(){endDrag(false);});
list.addEventListener("mousedown",function(e){
  if(e.button!==0||e.target.closest("button"))return;
  var tl=e.target.closest?e.target.closest(".tile"):null;
  if(!tl)return;
  lx=e.clientX;ly=e.clientY;
  lt=setTimeout(function(){beginDrag(tl,e.clientX,e.clientY);},380);
});
window.addEventListener("mousemove",function(e){
  if(!drag){if(lt&&(Math.abs(e.clientX-lx)>10||Math.abs(e.clientY-ly)>10))clearTimeout(lt);return;}
  moveDrag(e.clientX,e.clientY);
});
window.addEventListener("mouseup",function(){
  clearTimeout(lt);
  if(drag)endDrag(true);
});

var nums={};
function saveNums(){try{localStorage.setItem("vpnums-"+pid,JSON.stringify(nums));}catch(e){}}
function nextNum(){var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];return mx+1;}
function loadNums(){
  try{nums=JSON.parse(localStorage.getItem("vpnums-"+pid)||"{}");}catch(e){nums={};}
  var mx=0;for(var k in nums)if(nums[k]>mx)mx=nums[k];
  items.slice().sort(function(a,b){return a.order-b.order;}).forEach(function(it){if(!nums[it.id])nums[it.id]=++mx;});
  saveNums();
}
var mu=document.getElementById("mu");
function applyMute(){mu.textContent=v.muted?"🔇":"🔊";mu.classList.toggle("on",v.muted);}
try{v.muted=localStorage.getItem("vpmute")==="1";}catch(e){}
applyMute();
mu.addEventListener("click",function(){v.muted=!v.muted;try{localStorage.setItem("vpmute",v.muted?"1":"0");}catch(e){}applyMute();});
v.addEventListener("volumechange",applyMute);
var undo=[],und=document.getElementById("und"),undt=document.getElementById("undt");
function updUndo(){und.disabled=!undo.length;undt.textContent="Annulla"+(undo.length?" ("+undo.length+")":"");}
function pushUndo(e){undo.push(e);if(undo.length>50){var dropped=undo.shift();if(dropped&&dropped.del&&dropped.del.gone&&dropped.del.url){try{URL.revokeObjectURL(dropped.del.url);}catch(err){}}}updUndo();}
function doUndo(){
  var e=undo.pop();if(!e)return;
  var curItem=cur>=0?items[cur]:null;
  if(e.del){
    var it=e.del;it.gone=false;it.url=URL.createObjectURL(it.blob);
    items.splice(Math.min(e.index,items.length),0,it);
    put(it);
  }else if(e.order){
    var byId={};items.forEach(function(x){byId[x.id]=x;});
    var out=[];e.order.forEach(function(id){if(byId[id]){out.push(byId[id]);delete byId[id];}});
    items.forEach(function(x){if(byId[x.id])out.push(x);});
    items=out;
  }else if(e.nums){
    nums=e.nums;
    saveNums();
  }
  cur=curItem?items.indexOf(curItem):-1;
  saveOrder(!!e.order);
  if(e.order)setPendingOrder(undo.some(function(u){return !!u.order;}));
  updUndo();render();
}
und.addEventListener("click",doUndo);
updUndo();
var thm=document.getElementById("thm"),bgfile=document.getElementById("bgfile"),bgimg=document.getElementById("bgimg"),bgdim=document.getElementById("bgdim");
var hasBgPhoto=false,bgPhotoUrl="";
var themes=[{id:"black",label:"Nero"},{id:"gray",label:"Grigio"},{id:"white",label:"Bianco"},{id:"photo",label:"Foto"}],thmIdx=0;
try{var savedThm=localStorage.getItem("vpthm")||"black";var ti=themes.findIndex(function(x){return x.id===savedThm;});if(ti>=0)thmIdx=ti;}catch(e){}
function setBgPhotoBlob(blob){
  if(!blob)return;
  if(bgPhotoUrl){try{URL.revokeObjectURL(bgPhotoUrl);}catch(e){}}
  bgPhotoUrl=URL.createObjectURL(blob);
  bgimg.src=bgPhotoUrl;
  bgimg.classList.add("on");
  bgdim.classList.add("on");
  hasBgPhoto=true;
  applyTheme();
}
function saveBgPhotoDB(blob){
  if(!db)return;
  try{
    var tx=db.transaction("v","readwrite");
    tx.objectStore("v").put({id:"__bg_photo__",blob:blob,pid:"__sys__",order:0});
  }catch(e){}
}
function loadBgPhotoDB(){
  if(!db)return;
  try{
    var q=db.transaction("v").objectStore("v").get("__bg_photo__");
    q.onsuccess=function(){
      if(q.result&&q.result.blob){setBgPhotoBlob(q.result.blob);}
      else if(themes[thmIdx].id==="photo"){thmIdx=0;applyTheme();}
    };
  }catch(e){}
}
function applyTheme(){
  var avail=hasBgPhoto?themes:themes.filter(function(x){return x.id!=="photo";});
  var curId=themes[thmIdx]?themes[thmIdx].id:"black";
  if(!hasBgPhoto&&curId==="photo"){curId="black";thmIdx=0;}
  var t=avail.filter(function(x){return x.id===curId;})[0]||avail[0];
  document.documentElement.setAttribute("data-theme",t.id);
  if(thm)thm.textContent="Sfondo: "+t.label;
}
applyTheme();
if(thm)thm.addEventListener("click",function(){
  var avail=hasBgPhoto?themes:themes.filter(function(x){return x.id!=="photo";});
  var curId=themes[thmIdx]?themes[thmIdx].id:"black";
  var idx=avail.findIndex(function(x){return x.id===curId;});
  var next=avail[(idx+1)%avail.length];
  thmIdx=themes.findIndex(function(x){return x.id===next.id;});
  try{localStorage.setItem("vpthm",next.id);}catch(e){}
  applyTheme();
});
if(bgfile)bgfile.addEventListener("change",function(){
  var f=bgfile.files&&bgfile.files[0];
  bgfile.value="";
  if(!f)return;
  thmIdx=themes.findIndex(function(x){return x.id==="photo";});
  try{localStorage.setItem("vpthm","photo");}catch(e){}
  setBgPhotoBlob(f);
  saveBgPhotoDB(f);
});
fillProj();openDB(function(){loadBgPhotoDB();loadAll();});
})();
